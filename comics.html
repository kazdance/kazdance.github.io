<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>4コマ漫画 | カズ</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:system-ui,sans-serif;line-height:1.95}main{max-width:720px;margin:auto;padding:48px 24px 80px}a{color:inherit;text-underline-offset:4px}h1{font-size:1.6rem}#comics{display:grid;gap:32px}#comics a{display:block} .comic{display:grid;gap:12px;border-bottom:1px solid #eee;padding-bottom:28px}.comic h2{font-size:1.1rem;margin:0}#comics img{display:block;max-width:100%;height:auto;margin:auto}#comics{grid-template-columns:minmax(0,1fr);align-items:start;gap:24px}.comic{min-width:0;width:100%;max-width:420px;margin:0 auto;border:1px solid #bbb;padding:12px;gap:12px}.comic a{min-width:0}.comic img{width:100%;height:auto;border:1px solid #333}@media(min-width:768px){main{max-width:920px}#comics{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><nav><a href="/">← トップページへ戻る</a></nav><h1>4コマ漫画</h1><div id="comics"><p id="status">読み込み中…</p></div><script>const root=document.getElementById('comics');const fallback=["comics/002/5460_0.jpg","comics/002/5461_0.jpg","comics/002/5462_0.jpg","comics/002/5463_0.jpg",'comics/   001/5456_0.jpg','comics/   001/5457_0.jpg','comics/   001/5458_0.jpg'].map(path=>({repo:'dancelife',path}));function render(files){const groups=new Map();for(const f of files){const parts=f.path.split('/');const name=parts.pop();const stem=name.replace(/\.[^.]+$/,'');const key=parts.length>1?parts.slice(1).join('/').trim():(stem.match(/^(.+?)[_-](\d+)$/)||[])[1]||stem;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(f);}root.replaceChildren();for(const [key,items] of [...groups].sort((a,b)=>b[0].localeCompare(a[0],'ja',{numeric:true}))){const section=document.createElement('section');section.className='comic';const title=document.createElement('h2');title.textContent=({'001':'そういう意味じゃない','002':'ひとつ上のオジ','003':'また今日が終わる'})[key]||key;section.append(title);for(const f of items.sort((a,b)=>a.path.localeCompare(b.path,'ja',{numeric:true}))){const link=document.createElement('a');link.href=(f.repo==='dancelife'?'https://raw.githubusercontent.com/kazdance/dancelife/main/':'/')+f.path.split('/').map(encodeURIComponent).join('/');link.target='_blank';link.rel='noopener';const img=document.createElement('img');img.src=link.href;img.alt=key+' '+(section.children.length)+'枚目';img.loading='lazy';link.append(img);section.append(link);}root.append(section);}}render(fallback);async function load(){const results=await Promise.allSettled(['dancelife','kazdance.github.io'].map(async repo=>{const res=await fetch('https://api.github.com/repos/kazdance/'+repo+'/git/trees/main?recursive=1');if(!res.ok)throw Error();return (await res.json()).tree.filter(f=>f.type==='blob'&&/^comics\/.*\.(png|jpe?g|webp|gif)$/i.test(f.path)).map(f=>({repo,path:f.path}));}));const files=results.flatMap((r,i)=>r.status==='fulfilled'?r.value:i===0?fallback:[]);if(files.length)render(files);}load();</script></main></body></html>
