<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>4コマ漫画 | カズ</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:system-ui,sans-serif;line-height:1.95}main{max-width:720px;margin:auto;padding:48px 24px 80px}a{color:inherit;text-underline-offset:4px}h1{font-size:1.6rem}#comics{display:grid;gap:32px}#comics a{display:block}#comics img{display:block;max-width:100%;height:auto;margin:auto}</style></head><body><main><nav><a href="/">← トップページへ戻る</a></nav><h1>4コマ漫画</h1><div id="comics"><p id="status">読み込み中…</p></div><script>async function load(){const root=document.getElementById('comics');try{const res=await fetch('https://api.github.com/repos/kazdance/kazdance.github.io/contents/comics');if(!res.ok)throw Error();const files=(await res.json()).filter(f=>f.type==='file'&&/\.(png|jpe?g|webp|gif)$/i.test(f.name)).sort((a,b)=>b.name.localeCompare(a.name,'ja',{numeric:true}));root.replaceChildren();if(!files.length){root.textContent='作品はまだありません。';return;}for(const f of files){const link=document.createElement('a');link.href='./comics/'+encodeURIComponent(f.name);link.target='_blank';link.rel='noopener';const img=document.createElement('img');img.src=link.href;img.alt=f.name;img.loading='lazy';link.append(img);root.append(link);}}catch{root.textContent='作品一覧を読み込めませんでした。時間をおいて再読み込みしてください。';}}load();</script></main></body></html>
